<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Garden Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth">
  <div class="hero">
    <h1>Green Corner Community Garden</h1>
    <p>Plots, tasks, harvests and volunteers, all in one place.</p>
    <div class="leaves"><i></i><i></i><i></i></div>
  </div>
  <div class="auth-card">
    <div class="tabs" id="roleTabs">
      <button type="button" class="on" data-role="admin">Admin</button>
      <button type="button" data-role="member">Member</button>
    </div>
    <form id="loginForm" novalidate>
      <h2 id="loginTitle">Admin login</h2>
      <label>Email<input id="lEmail" type="email" autocomplete="username" placeholder="sample@example.com"></label>
      <label>Password<input id="lPass" type="password" autocomplete="current-password" placeholder="Your password"></label>
      <p class="err" id="lErr" role="alert"></p>
      <button class="btn wide">Log in</button>
      <p class="alt"><a href="#" id="fill"> Click Here! <br>Fill demo credentials</a></p>
      <p class="alt" id="regLink" hidden>New here? <a href="#" id="showReg">Register as a member</a></p>
    </form>
    <form id="regForm" novalidate hidden>
      <h2>Member registration</h2>
      <label>Full name<input id="rName" autocomplete="name"></label>
      <label>Email<input id="rEmail" type="email" autocomplete="email"></label>
      <label>Phone (optional)<input id="rPhone" type="tel" placeholder="10 digits"></label>
      <label>Password<input id="rPass" type="password" autocomplete="new-password" placeholder="8+ characters, letters and a number"></label>
      <p class="err" id="rErr" role="alert"></p>
      <button class="btn wide">Create account</button>
      <p class="alt"><a href="#" id="showLogin">Back to login</a></p>
    </form>
  </div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand">🌿 Green Corner</div>
    <nav id="nav"></nav>
    <button class="btn ghost" id="reset" hidden>Reset demo data</button>
    <button class="btn ghost" id="logout">Log out</button>
  </aside>
  <div class="main">
    <header>
      <button id="burger" aria-label="Open menu">☰</button>
      <h2 id="pageTitle"></h2>
      <span id="who"></span>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modal" hidden><div class="dlg" id="dlg"></div></div>
<div id="toasts" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
